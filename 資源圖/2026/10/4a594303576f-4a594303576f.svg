<svg viewBox="0 0 680 206" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Windows 应用数据的四层存放结构</title>
<desc>ProgramData 全用户共享，Roaming 属用户资产随账号走，Local 属机器资产存缓存，LocalLow 供低权限沙箱使用。</desc>

<g>
<rect x="40" y="48" width="139" height="70" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="54" y="68" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ProgramData</text>
<text x="54" y="86" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#444441" dominant-baseline="central">全用户共享</text>
<text x="54" y="102" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#444441" dominant-baseline="central">机器级配置</text>
</g>

<g>
<rect x="193" y="48" width="139" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="207" y="68" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">Roaming</text>
<text x="207" y="86" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#0C447C" dominant-baseline="central">用户资产</text>
<text x="207" y="102" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#0C447C" dominant-baseline="central">换机要带走</text>
</g>

<g>
<rect x="346" y="48" width="139" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="360" y="68" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">Local</text>
<text x="360" y="86" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#085041" dominant-baseline="central">机器资产</text>
<text x="360" y="102" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#085041" dominant-baseline="central">可重建缓存</text>
</g>

<g>
<rect x="499" y="48" width="139" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="513" y="68" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">LocalLow</text>
<text x="513" y="86" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#444441" dominant-baseline="central">低完整性</text>
<text x="513" y="102" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#444441" dominant-baseline="central">沙箱隔离区</text>
</g>

<rect x="40" y="138" width="598" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="156" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#26215C" dominant-baseline="central">判断口诀：换台电脑还想留的写 Roaming，能重建的缓存写 Local</text>
<text x="58" y="176" font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#3C3489" dominant-baseline="central">卸载不清理 Roaming 是设计意图 —— 想彻底重置软件，删它对应的子目录</text>
</svg>
